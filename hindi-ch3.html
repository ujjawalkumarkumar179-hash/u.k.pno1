let currentQuestion = 0;
let score = 0;
let answered = false;


function showQuestion(){

    answered = false;

    const q = questions[currentQuestion];

    let html = `
        <div class="progress">
            प्रश्न ${currentQuestion + 1} / ${questions.length}
        </div>

        <div class="question">
            ${q.question}
        </div>
    `;

    q.options.forEach((option,index)=>{

        html += `
            <button
                class="option"
                id="option-${index}"
                onclick="selectAnswer(${index})">

                ${String.fromCharCode(65+index)}. ${option}

            </button>
        `;

    });


    if(currentQuestion < questions.length - 1){

        html += `
            <div style="text-align:center;">
                <button
                    class="next-btn"
                    id="nextBtn"
                    onclick="nextQuestion()"
                    style="display:none;">

                    अगला प्रश्न ➡️

                </button>
            </div>
        `;

    }else{

        html += `
            <div style="text-align:center;">
                <button
                    class="next-btn"
                    id="nextBtn"
                    onclick="showResult()"
                    style="display:none;">

                    परिणाम देखें 🏆

                </button>
            </div>
        `;
    }

    document.getElementById("quiz").innerHTML = html;
}


function selectAnswer(selected){

    if(answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll(".option");

    buttons.forEach(button=>{
        button.disabled = true;
    });


    if(selected === q.answer){

        score++;

        document
        .getElementById("option-"+selected)
        .classList.add("correct");

    }else{

        document
        .getElementById("option-"+selected)
        .classList.add("wrong");

        document
        .getElementById("option-"+q.answer)
        .classList.add("correct");
    }


    document.getElementById("nextBtn").style.display="inline-block";
}


function nextQuestion(){

    currentQuestion++;

    showQuestion();
}


function showResult(){

    const percentage =
        Math.round((score/questions.length)*100);

    let grade="";

    if(percentage>=90){

        grade="🏆 शानदार! Gold A+";

    }else if(percentage>=75){

        grade="🥈 बहुत अच्छा! Silver A";

    }else if(percentage>=60){

        grade="🥉 अच्छा प्रयास! Bronze B";

    }else{

        grade="📚 Keep Practicing!";
    }


    document.getElementById("quiz").innerHTML=`

        <div class="result">

            <h2>🎉 Test पूरा हुआ!</h2>

            <div class="score">
                आपका Score: ${score} / ${questions.length}
            </div>

            <p style="font-size:20px;">
                Percentage: ${percentage}%
            </p>

            <h3 style="font-size:22px;">
                ${grade}
            </h3>

            <button
                class="restart-btn"
                onclick="restartQuiz()">

                🔄 फिर से Test दें

            </button>

        </div>
    `;
}


function restartQuiz(){

    currentQuestion=0;
    score=0;
    answered=false;

    showQuestion();
}


showQuestion();

</script>

</body>
  </html>
