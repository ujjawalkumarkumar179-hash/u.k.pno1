let currentQuestion=0;
let score=0;
let answered=false;


function showQuestion(){

answered=false;

const q=questions[currentQuestion];

document.getElementById("questionNumber").textContent=
"प्रश्न "+(currentQuestion+1)+" / "+questions.length;

document.getElementById("question").textContent=q.q;

const optionsDiv=document.getElementById("options");

optionsDiv.innerHTML="";

q.options.forEach((option,index)=>{

const button=document.createElement("button");

button.className="option";

button.textContent=
String.fromCharCode(65+index)+". "+option;

button.onclick=function(){
selectAnswer(index,button);
};

optionsDiv.appendChild(button);

});

document.getElementById("nextBtn").style.display="none";

}


function selectAnswer(selectedIndex,selectedButton){

if(answered) return;

answered=true;

const q=questions[currentQuestion];

const allOptions=document.querySelectorAll(".option");

allOptions.forEach((button,index)=>{

button.disabled=true;

if(index===q.answer){
button.classList.add("correct");
}

});

if(selectedIndex===q.answer){

score++;

}else{

selectedButton.classList.add("wrong");

}

document.getElementById("nextBtn").style.display="block";

}


function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

showResult();

}

}


function showResult(){

document.getElementById("quizArea").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("score").textContent=
"आपका Score: "+score+" / "+questions.length;

let percentage=(score/questions.length)*100;

let message="";

if(percentage>=90){

message="🏆 शानदार! आपकी तैयारी बहुत अच्छी है।";

}else if(percentage>=75){

message="🥈 बहुत बढ़िया! थोड़ी और तैयारी करें।";

}else if(percentage>=60){

message="🥉 अच्छा प्रयास! और अभ्यास करें।";

}else{

message="📚 अभ्यास जारी रखें। आप और बेहतर कर सकते हैं!";

}

document.getElementById("resultMessage").textContent=message;

}


function restartQuiz(){

currentQuestion=0;

score=0;

document.getElementById("quizArea").style.display="block";

document.getElementById("result").style.display="none";

showQuestion();

}


showQuestion();

</script>
