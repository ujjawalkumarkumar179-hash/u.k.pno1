            font-weight: bold;

        #submitBtn {
            background: #1565c0;
            color: white;
        }

        #submitBtn:hover {
            background: #0d47a1;
        }

        #restartBtn {
            background: #7b1fa2;
            color: white;
            display: none;
        }

        #result {
            display: none;
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        #result h2 {
            color: #7b1fa2;
        }

        #score {
            font-size: 22px;
        }

        #message {
            font-size: 18px;
        }

        .back {
            text-align: center;
            margin: 30px;
        }

        .back a {
            display: inline-block;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .quiz-box {
                padding: 10px;
            }

            .question {
                font-size: 17px;
            }
        }
    </style>
</head>

<div class="back">
