    options: ["समानता और मानवीय स्वतंत्रता", "जातिगत भेदभाव", "रूढ़िवादिता", "ऊँच-नीच"],
    answer: 0

let currentQuestion = 0;
let score = 0;
let answered = false;


function showQuestion() {

    answered = false;

    const quiz = document.getElementById("quiz");

    const q = questions[currentQuestion];

    quiz.innerHTML = `

        <div class="progress">
            प्रश्न ${currentQuestion + 1} / ${questions.length}
        </div>

        <div class="question-box">

            <div class="question">
                ${q.q}
            </div>

            ${q.options.map((option, index) => `
                <button
                    class="option"
                    onclick="selectAnswer(${index})">
                    ${String.fromCharCode(65 + index)}. ${option}
                </button>
            `).join("")}

            <button
                id="nextBtn"
                class="next-btn"
                style="display:none;"
                onclick="nextQuestion()">
                अगला प्रश्न ➡️
            </button>

        </div>
    `;
}


function selectAnswer(selected) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll(".option");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === q.answer) {
            button.classList.add("correct");
        }

        if (index === selected && selected !== q.answer) {
            button.classList.add("wrong");
        }

    });

    if (selected === q.answer) {
        score++;
    }

    document.getElementById("nextBtn").style.display = "block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }
}


function showResult() {

    const quiz = document.getElementById("quiz");

    let message = "";

    if (score >= 45) {
        message = "🏆 शानदार प्रदर्शन!";
    }
    else if (score >= 35) {
        message = "🎉 बहुत अच्छा!";
    }
    else if (score >= 25) {
        message = "👍 अच्छा प्रयास!";
    }
    else {
        message = "📚 और अभ्यास करें!";
    }

    quiz.innerHTML = `

        <div class="result">

            <h2>🎊 Test Complete 🎊</h2>

            <p class="score">
                ${score} / ${questions.length}
            </p>

            <h3>${message}</h3>

            <p>
                आपने Chapter 1 के 50 MCQ पूरे कर लिए हैं।
            </p>

            <button
                class="restart-btn"
                onclick="restartQuiz()">
                🔄 Test फिर से दें
            </button>

        </div>
    `;
}


function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    showQuestion();

}


showQuestion();

</script>
