/* =========================
   QUIZ SYSTEM
========================= */

let current = 0;
let score = 0;
let answered = false;

const qno = document.getElementById("qno");
const question = document.getElementById("question");
const options = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const questionBox = document.getElementById("questionBox");
const result = document.getElementById("result");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");
const restartBtn = document.getElementById("restartBtn");


function showQuestion(){

    answered = false;

    const item = questions[current];

    qno.textContent =
        "प्रश्न " + (current + 1) + " / " + questions.length;

    question.textContent = item.q;

    options.innerHTML = "";

    item.o.forEach(function(optionText,index){

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            optionText;

        button.addEventListener("click",function(){

            selectAnswer(index,button);

        });

        options.appendChild(button);

    });

    nextBtn.style.display = "none";
}


function selectAnswer(selected,selectedButton){

    if(answered){
        return;
    }

    answered = true;

    const correct = questions[current].a;

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(function(button,index){

        button.disabled = true;

        if(index === correct){

            button.classList.add("correct");

        }

    });


    if(selected === correct){

        score++;

    }else{

        selectedButton.classList.add("wrong");

    }

    nextBtn.style.display = "block";
}


nextBtn.addEventListener("click",function(){

    current++;

    if(current < questions.length){

        showQuestion();

    }else{

        showResult();

    }

});


function showResult(){

    questionBox.style.display = "none";

    result.style.display = "block";

    scoreText.textContent =
        "आपका Score: " + score + " / " + questions.length;

    const percentage =
        (score / questions.length) * 100;

    if(percentage >= 90){

        message.textContent =
            "🏆 शानदार! आपकी तैयारी बहुत अच्छी है।";

    }else if(percentage >= 75){

        message.textContent =
            "🥈 बहुत बढ़िया! थोड़ा और अभ्यास करें।";

    }else if(percentage >= 60){

        message.textContent =
            "🥉 अच्छा प्रयास! अध्याय को एक बार फिर पढ़ें।";

    }else{

        message.textContent =
            "📚 अभ्यास जारी रखें। आप अगली बार बेहतर कर सकते हैं!";

    }

}


restartBtn.addEventListener("click",function(){

    current = 0;

    score = 0;

    questionBox.style.display = "block";

    result.style.display = "none";

    showQuestion();

});


/* START QUIZ */
showQuestion();
