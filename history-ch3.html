const letters=["A","B","C","D"];
const answers={};
const box=document.getElementById("questions");

data.forEach((q,i)=>{
let n=i+1;
answers["q"+n]=q[5];
let html='<div class="q"><p>'+n+'. '+q[0]+'</p>';
for(let j=0;j<4;j++){
html+='<label><input type="radio" name="q'+n+'" value="'+letters[j]+'"> '+letters[j]+'. '+q[j+1]+'</label>';
}
html+='</div>';
box.innerHTML+=html;
});

function checkResult(){
let score=0;
for(let i=1;i<=50;i++){
let a=document.querySelector('input[name="q'+i+'"]:checked');
if(a&&a.value===answers["q"+i])score++;
}
let grade=score>=45?"A+":score>=38?"A":score>=30?"B":"C";
let r=document.getElementById("result");
r.style.display="block";
r.innerHTML="Score: "+score+"/50<br>Percentage: "+(score*2)+"%<br>Grade: "+grade;
r.scrollIntoView({behavior:"smooth"});
}
