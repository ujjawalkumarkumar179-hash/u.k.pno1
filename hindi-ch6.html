const quiz = document.getElementById("quiz");


questions.forEach((item, index) => {

    const card = document.createElement("div");

    card.className = "question-card";

    let html = `
        <div class="question">
            ${index + 1}. ${item.q}
        </div>
    `;

    item.o.forEach((option, optionIndex) => {

        html += `
            <label class="option">
                <input
                    type="radio"
                    name="question${index}"
                    value="${optionIndex}"
                >
                ${option}
            </label>
        `;

    });

    card.innerHTML = html;

    quiz.appendChild(card);

});


function submitQuiz() {

    let score = 0;

    questions.forEach((item, index) => {

        const selected =
            document.querySelector(
                `input[name="question${index}"]:checked`
            );

        if (selected && Number(selected.value) === item.a) {
            score++;
        }

    });


    document.getElementById("score").innerHTML =
        `आपका Score: <strong>${score} / ${questions.length}</strong>`;


    let message = "";

    const percentage =
        (score / questions.length) * 100;


    if (percentage >= 90) {
        message = "🏆 शानदार! आपकी तैयारी बहुत अच्छी है।";
    }
    else if (percentage >= 75) {
        message = "🥈 बहुत अच्छा! थोड़ी और तैयारी करें।";
    }
    else if (percentage >= 60) {
        message = "🥉 अच्छा प्रयास! कमजोर प्रश्नों को दोबारा पढ़ें।";
    }
    else {
        message = "📚 कोई बात नहीं! Chapter 6 को फिर से पढ़कर दोबारा Test दें।";
    }


    document.getElementById("message").innerHTML = message;

    document.getElementById("result").style.display = "block";

    document.getElementById("submitBtn").style.display = "none";

    document.getElementById("restartBtn").style.display = "block";

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

}

</script>
