
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UKP Admin - Notice Board</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:18px;
 background:#07152d;
 color:white;
 font-family:Arial,sans-serif;
}
.container{
 max-width:650px;
 margin:20px auto;
 background:#10264b;
 padding:22px;
 border:3px double #d6ae45;
 border-radius:16px;
}
h1,h2{text-align:center;color:#ffd76a}
input,textarea{
 width:100%;
 padding:13px;
 margin:9px 0;
 border:1px solid #d6ae45;
 border-radius:8px;
 font-size:16px;
}
textarea{min-height:120px;resize:vertical}
button{
 padding:11px 16px;
 border:0;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
 margin:5px 3px;
}
.save{background:#e6b943;color:#102040}
.edit{background:#2878d0;color:white}
.delete{background:#d93636;color:white}
.logout{background:#555;color:white}
.notice{
 background:#fff;
 color:#17233a;
 padding:15px;
 margin:13px 0;
 border-radius:10px;
 border-left:5px solid #e2b33e;
}
.notice h3{color:#9a6a00;margin-top:0}
.notice p{white-space:pre-wrap;overflow-wrap:anywhere}
.small{font-size:12px;color:#aaa}
#status{text-align:center;color:#ffd76a}
#adminArea{display:none}
#loginMessage{text-align:center;color:#ffd76a}
.actions{display:flex;flex-wrap:wrap}
label{display:block;margin-top:10px}
</style>
</head>

<body>

<div class="container">

<h1>U.K.P NO1 EDUCATION</h1>
<h2>NOTICE BOARD ADMIN PANEL</h2>

<p id="status">Firebase से जुड़ रहा है...</p>

<div id="loginMessage" style="display:none">
 <p>पहले अपने Admin Account से Login करें।</p>
 <button class="save" onclick="location.href='account.html'">
  Login Page खोलें
 </button>
</div>

<div id="adminArea">

<h2 id="formHeading">नया Notice जोड़ें</h2>

<form id="noticeForm">

<input id="noticeTitle"
 type="text"
 placeholder="Notice का शीर्षक लिखें"
 maxlength="100"
 required>

<textarea id="noticeMessage"
 placeholder="Notice की पूरी जानकारी लिखें"
 maxlength="5000"
 required></textarea>

<label>
 <input type="checkbox" id="noticePinned">
 इस Notice को सबसे ऊपर Pin करें
</label>

<button class="save" type="submit" id="saveButton">
 + Add Notice
</button>

<button type="button" class="logout" id="cancelButton"
 style="display:none" onclick="resetForm()">
 Cancel Edit
</button>

</form>

<hr>

<h2>सभी Notices</h2>
<div id="noticeList">Loading...</div>

<button class="logout" onclick="logoutAdmin()">
 Logout
</button>

</div>
</div>

<script>

// Firebase Configuration
const firebaseConfig = {
 apiKey: "AIzaSyDv1tOYiuQAYAtOa85-9gZvM-fCrjWow6E",
 authDomain: "ukp-no1-education.firebaseapp.com",
 projectId: "ukp-no1-education",
 storageBucket: "ukp-no1-education.firebasestorage.app",
 messagingSenderId: "983226412948",
 appId: "1:983226412948:web:7d332914d26850085ca981",
 measurementId: "G-HPJLJLQBVX"
};

// Admin UID
const ADMIN_UID = "RhTcq6JVxVZJQQWovmLiveiJbl53";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let editingId = null;

const statusBox = document.getElementById("status");
const adminArea = document.getElementById("adminArea");
const loginMessage = document.getElementById("loginMessage");
const noticeList = document.getElementById("noticeList");

// Authentication Check
auth.onAuthStateChanged(function(user){

 if(!user){
  statusBox.textContent = "Login आवश्यक है";
  adminArea.style.display = "none";
  loginMessage.style.display = "block";
  return;
 }

 if(user.uid !== ADMIN_UID){
  statusBox.textContent = "आपको Admin की अनुमति नहीं है।";
  adminArea.style.display = "none";
  loginMessage.style.display = "none";
  return;
 }

 statusBox.textContent = "Admin Login सफल!";
 loginMessage.style.display = "none";
 adminArea.style.display = "block";

 loadNotices();

});

// Add or Update Notice
document.getElementById("noticeForm")
.addEventListener("submit", async function(e){

 e.preventDefault();

 const user = auth.currentUser;

 if(!user || user.uid !== ADMIN_UID){
  alert("Admin Permission नहीं है!");
  return;
 }

 const title = document.getElementById("noticeTitle").value.trim();
 const message = document.getElementById("noticeMessage").value.trim();
 const pinned = document.getElementById("noticePinned").checked;

 if(!title || !message){
  alert("कृपया सभी जानकारी भरें।");
  return;
 }

 const button = document.getElementById("saveButton");
 button.disabled = true;

 try{

  if(editingId){

   await db.collection("notices").doc(editingId).update({
    title:title,
    message:message,
    pinned:pinned,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
   });

   alert("Notice सफलतापूर्वक Update हुआ!");

  }else{

   await db.collection("notices").add({
    title:title,
    message:message,
    pinned:pinned,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    createdBy:user.uid
   });

   alert("नया Notice सफलतापूर्वक जुड़ गया!");

  }

  resetForm();
  loadNotices();

 }catch(error){
  console.error(error);
  alert("Error: " + error.message);
 }finally{
  button.disabled = false;
 }

});

// Load Notices
async function loadNotices(){

 noticeList.textContent = "Notices लोड हो रहे हैं...";

 try{

  const snapshot = await db.collection("notices")
   .orderBy("createdAt","desc")
   .get();

  noticeList.replaceChildren();

  if(snapshot.empty){
   noticeList.textContent = "अभी कोई Notice नहीं है।";
   return;
  }

  const docs = snapshot.docs.slice().sort((a,b)=>{
   const ap = a.data().pinned ? 1 : 0;
   const bp = b.data().pinned ? 1 : 0;
   return bp-ap;
  });

  docs.forEach(doc=>{

   const data = doc.data();

   const card = document.createElement("div");
   card.className = "notice";

   const heading = document.createElement("h3");
   heading.textContent = (data.pinned ? "📌 " : "") + (data.title || "Notice");

   const content = document.createElement("p");
   content.textContent = data.message || "";

   const date = document.createElement("div");
   date.className = "small";

   if(data.createdAt && data.createdAt.toDate){
    date.textContent = "तारीख: " +
      data.createdAt.toDate().toLocaleString("hi-IN");
   }

   const actions = document.createElement("div");
   actions.className = "actions";

   const editButton = document.createElement("button");
   editButton.className = "edit";
   editButton.textContent = "Edit";
   editButton.onclick = ()=>editNotice(doc.id,data);

   const deleteButton = document.createElement("button");
   deleteButton.className = "delete";
   deleteButton.textContent = "Delete";
   deleteButton.onclick = ()=>deleteNotice(doc.id);

   actions.append(editButton,deleteButton);
   card.append(heading,content,date,actions);

   noticeList.appendChild(card);

  });

 }catch(error){
  console.error(error);
  noticeList.textContent = "Notice लोड नहीं हुए: " + error.message;
 }

}

// Edit Notice
function editNotice(id,data){

 editingId = id;

 document.getElementById("noticeTitle").value = data.title || "";
 document.getElementById("noticeMessage").value = data.message || "";
 document.getElementById("noticePinned").checked = !!data.pinned;

 document.getElementById("formHeading").textContent = "Notice Edit करें";
 document.getElementById("saveButton").textContent = "Update Notice";
 document.getElementById("cancelButton").style.display = "inline-block";

 window.scrollTo({top:0,behavior:"smooth"});

}

// Delete Notice
async function deleteNotice(id){

 if(!confirm("क्या आप यह Notice Delete करना चाहते हैं?")){
  return;
 }

 try{

  await db.collection("notices").doc(id).delete();

  alert("Notice Delete हो गया!");
  loadNotices();

 }catch(error){
  alert("Delete Error: " + error.message);
 }

}

// Reset Form
function resetForm(){

 editingId = null;

 document.getElementById("noticeForm").reset();
 document.getElementById("formHeading").textContent = "नया Notice जोड़ें";
 document.getElementById("saveButton").textContent = "+ Add Notice";
 document.getElementById("cancelButton").style.display = "none";

}

// Logout
async function logoutAdmin(){

 if(confirm("क्या आप Logout करना चाहते हैं?")){
  await auth.signOut();
  location.href = "account.html";
 }

}

</script>

</body>
  </html>
