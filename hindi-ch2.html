        q: "‘विष के दाँत’ कहानी में बच्चों का संघर्ष किस बात को उजागर करता है?",
        options: [
            "बड़े सामाजिक अंतर को",
            "मौसम को",
            "कृषि को",
            "भाषा को"
        ],
        answer: 0
    },

    {
        q: "कहानी का शीर्षक पाठ की सामाजिक समस्या को किस रूप में प्रस्तुत करता है?",
        options: [
            "प्रतीकात्मक रूप में",
            "वैज्ञानिक रूप में",
            "ऐतिहासिक रूप में",
            "भौगोलिक रूप में"
        ],
        answer: 0
    },

    {
        q: "‘विष के दाँत’ से जुड़े प्रश्नों में मुख्य रूप से किस विषय पर ध्यान दिया जाता है?",
        options: [
            "पात्र, घटना और सामाजिक संदेश",
            "केवल प्रकृति",
            "केवल भूगोल",
            "केवल गणित"
        ],
        answer: 0
    },

    {
        q: "इस कहानी का अध्ययन किस सामाजिक मूल्य को समझने में मदद करता है?",
        options: [
            "समानता और मानवीय सम्मान",
            "भेदभाव",
            "अहंकार",
            "ऊँच-नीच"
        ],
        answer: 0
    }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


function showQuestion() {

    answered = false;

    const quiz = document.getElementById("quiz");
    const q = questions[currentQuestion];

    quiz.innerHTML = `

        <div class="progress">
            प्रश्न ${currentQuestion + 1} / ${questions.length}
        </div>

        <div class="question-box">

            <div class="question">
                ${q.q}
            </div>

            ${q.options.map((option, index) => `
                <button
                    class="option"
                    onclick="selectAnswer(${index})">
                    ${String.fromCharCode(65 + index)}. ${option}
                </button>
            `).join("")}

            <button
                id="nextBtn"
                class="next-btn"
                style="display:none;"
                onclick="nextQuestion()">
                अगला प्रश्न ➡️
            </button>

        </div>
    `;
}


function selectAnswer(selected) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll(".option");

    buttons.forEach((button, index) => {

        button.disabled = true;

        if (index === q.answer) {
            button.classList.add("correct");
        }

        if (index === selected && selected !== q.answer) {
            button.classList.add("wrong");
        }

    });

    if (selected === q.answer) {
        score++;
    }

    document.getElementById("nextBtn").style.display = "block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }
}


function showResult() {

    const quiz = document.getElementById("quiz");

    let message;

    if (score >= 45) {
        message = "🏆 शानदार प्रदर्शन!";
    } else if (score >= 35) {
        message = "🎉 बहुत अच्छा!";
    } else if (score >= 25) {
        message = "👍 अच्छा प्रयास!";
    } else {
        message = "📚 और अभ्यास करें!";
    }

    quiz.innerHTML = `

        <div class="result">

            <h2>🎊 Test Complete 🎊</h2>

            <p class="score">
                ${score} / ${questions.length}
            </p>

            <h3>${message}</h3>

            <p>
                आपने Hindi Chapter 2 के सभी 50 MCQ पूरे कर लिए हैं।
            </p>

            <button
                class="restart-btn"
                onclick="restartQuiz()">
                🔄 Test फिर से दें
            </button>

        </div>
    `;
}


function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    showQuestion();
}


showQuestion();

</script>
